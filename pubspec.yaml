name: github_repository_explorer
description: A production-minded GitHub repository explorer built with Flutter.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  dio: ^5.10.0
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  json_annotation: ^4.12.0
  stream_transform: ^2.1.1
  url_launcher: ^6.3.2

dev_dependencies:
  bloc_test: ^10.0.0
  # Exact pins keep the code generators on a shared Analyzer 10.x line.
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  test: ^1.31.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#D8EBFF"
  adaptive_icon_foreground: assets/branding/adaptive_icon_foreground.png
  adaptive_icon_foreground_inset: 16
  min_sdk_android: 24
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F7F9FC"
  color_dark: "#07111F"
  image: assets/branding/splash_logo.png
  image_dark: assets/branding/splash_logo_dark.png
  android_12:
    color: "#F7F9FC"
    color_dark: "#07111F"
    image: assets/branding/splash_logo_android12.png
    image_dark: assets/branding/splash_logo_android12_dark.png
